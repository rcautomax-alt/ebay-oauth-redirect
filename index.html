<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>eBay Authorization</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    }
    .container {
      background: white;
      padding: 40px;
      border-radius: 8px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
      text-align: center;
      max-width: 500px;
    }
    h1 {
      color: #333;
      margin-top: 0;
    }
    .success {
      color: #28a745;
    }
    .error {
      color: #dc3545;
    }
    .info-box {
      background: #f8f9fa;
      padding: 15px;
      border-radius: 4px;
      margin: 20px 0;
      font-size: 14px;
      word-break: break-all;
      font-family: monospace;
    }
    .button {
      background: #667eea;
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 14px;
      margin-top: 10px;
    }
    .button:hover {
      background: #764ba2;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Authorization Received</h1>
    <div id="message"></div>
    <div id="info" class="info-box" style="display:none;"></div>
    <button class="button" onclick="window.close()">Close This Tab</button>
  </div>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const code = urlParams.get('code');
    const error = urlParams.get('error');
    const messageEl = document.getElementById('message');
    const infoEl = document.getElementById('info');

    if (error) {
      messageEl.innerHTML = `<p class="error"><strong>Error:</strong> ${error}</p>`;
      infoEl.style.display = 'block';
      infoEl.textContent = 'Please check your credentials and try again.';
    } else if (code) {
      messageEl.innerHTML = '<p class="success">✓ Your eBay account has been connected.</p>';
      infoEl.style.display = 'block';
      infoEl.innerHTML = `<strong>Auth Code:</strong><br>${code}<br><br><em>This code is valid for 5 minutes. Copy it if needed.</em>`;
    } else {
      messageEl.innerHTML = '<p class="error">Something went wrong. No authorization code received.</p>';
    }
  </script>
</body>
</html>
